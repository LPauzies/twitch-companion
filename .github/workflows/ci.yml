name: "CI — Build, Lint & Validate MV3"

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build_and_validate:
    name: Build & Validate Chrome & Firefox MV3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build MV3 extensions
        run: npm run build:all

      - name: Run ESLint + Chrome MV3 Validator + Firefox web-ext lint
        run: npm run lint:all

      - name: Package Chrome, Firefox & Source archives
        run: |
          npm run package:all
          npm run package:source

      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twitch-companion-ci-${{ github.sha }}
          path: dist/*.zip
          retention-days: 7
