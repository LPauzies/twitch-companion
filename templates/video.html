<div class="stream js-tab js-filterable" data-href="{{url}}">
    <div class="item-image-container stream-preview">
        <img alt="{{title}}" class="lazy" data-original="{{preview.medium}}"/>
        <div class="stream-uptime">
            {{h-date-format length}}
        </div>
    </div>
    <div class="stream-body">
        <span class="stream-info stream-title" title="{{title}}">
            {{title}}
        </span>
        <span class="stream-info stream-info-viewers">
            {{channel.display_name}}{{#if game}} &middot; {{game}}{{/if}}
        </span>
        <span class="stream-info stream-info-date">
            {{h-prettydate recorded_at}}
        </span>
    </div>
</div>
