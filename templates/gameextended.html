<div class="game-lobby-inner">
    <div class="item-image-container game-preview">
        <img src="{{ box_art_url }}" alt="{{ name }}"/>
    </div>
    <div class="game-lobby-body">
        <span class="stream-info stream-title" title="{{ name }}">{{ name }}</span>
        <div class="game-lobby-stats">
            {{#if viewers}}
            <span class="game-stat">{{h-num-format viewers}} __MSG_m45__</span>
            {{/if}}
            {{#if channels}}
            <span class="meta-sep" aria-hidden="true">&middot;</span>
            <span class="game-stat">{{h-num-format channels}} __MSG_m46__</span>
            {{/if}}
        </div>
        <div class="buttons">
            <span class="button active" data-route="browse/{{h-enc name}}/streams">
                <svg class="btn-svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/>
                    <rect x="2" y="6" width="14" height="12" rx="2"/>
                </svg>
                <span>__MSG_m89__</span>
                <div class="indicator"></div>
            </span>
            <span class="button" data-route="browse/{{h-enc name}}/videos">
                <svg class="btn-svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polygon points="6 3 20 12 6 21 6 3"/>
                </svg>
                <span>__MSG_m21__</span>
                <div class="indicator"></div>
            </span>
        </div>
    </div>
</div>
