<div class="stream js-filterable">
    <div class="item-image-container stream-preview">
        {{#if favorite}}
        <div class="stream-uptime">
            {{h-uptime started_at}}
        </div>
        {{/if}}
        <img class="lazy" alt="{{ user_name }}" data-original="{{ thumbnail_url }}"/>
    </div>
    <div class="stream-body">
        <div class="stream-top-row">
            <span class="stream-info stream-title">{{ user_name }}</span>
            <span class="stream-viewers-count">
                {{#if vodcast}}
                <span class="icon-vodcast" title="vodcast"></span>
                {{else}}
                <span class="live-dot" aria-hidden="true"></span>
                {{/if}}
                <span>{{h-num-format viewer_count}}</span>
            </span>
        </div>
        <span class="stream-info stream-info-status" title="{{ title }}">
            {{ title }}
        </span>
        <span class="stream-info stream-info-viewers">
            {{ game_name }}
        </span>
    </div>
</div>
