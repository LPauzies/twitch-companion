<div class="stream stream-channel js-filterable">
    <div class="item-image-container channel-logo offline">
        <img class="lazy" alt="{{to_name}}" data-original="{{logo}}"/>
    </div>
    <div class="stream-body">
        <span class="stream-info stream-title">{{to_name}}</span>
        {{#if game}}
        <span class="stream-info stream-info-viewers">{{game}}</span>
        {{/if}}
    </div>
</div>
