<div class="stream game-list-item js-filterable" data-route="browse/{{h-enc name}}/streams">
    <div class="item-image-container game-preview">
        <img alt="{{name}}" loading="lazy" src="{{ box_art_url }}" />
    </div>
    <div class="game-meta">
        <span title="{{name}}" class="stream-info stream-title">{{name}}</span>
        {{#if viewers}}
        <span class="stream-info game-stat">{{h-num-format viewers}} __MSG_m45__</span>
        {{/if}}
    </div>
</div>
